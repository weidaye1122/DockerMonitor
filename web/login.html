<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark"><title>登录 · Docker Monitor</title><meta name="theme-color" content="#0071e3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Docker Monitor"><link rel="icon" href="/favicon.ico?v=a2" sizes="any"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=a2"><link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=a2"><link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png?v=a2"><link rel="manifest" href="/manifest.webmanifest?v=a2">
  <link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/login.css">
  <script src="/vendor/lucide.js" defer></script><script src="/login.js" defer></script>
</head>
<body><div id="dock-preview" class="dw-login-page">
  <header class="dw-login-header"><a class="dw-login-brand" href="/login"><span class="dw-logo"><img src="/icons/icon.svg?v=a2" alt="Docker Monitor"></span><span>Docker Monitor</span></a><div class="dw-theme-toggle" role="group" aria-label="外观模式"><button type="button" class="dw-theme-button" data-theme="light" aria-label="浅色模式"><i data-lucide="sun" aria-hidden="true"></i></button><button type="button" class="dw-theme-button" data-theme="dark" aria-label="暗色模式"><i data-lucide="moon" aria-hidden="true"></i></button><button type="button" class="dw-theme-button" data-theme="auto" aria-label="跟随系统"><i data-lucide="monitor" aria-hidden="true"></i></button></div></header>
  <main class="dw-login-main"><section class="dw-login-card" aria-labelledby="login-title">
    <div class="dw-login-mark"><img src="/icons/icon.svg?v=a2" alt="Docker Monitor"></div>
    <h1 id="login-title">登录 Docker Monitor</h1><p class="dw-login-subtitle">查看容器状态，管理每一次更新。</p>
    <form id="login-form">
      <label for="username">账号</label><div class="dw-login-input"><i data-lucide="user-round" aria-hidden="true"></i><input id="username" name="username" type="text" placeholder="请输入登录账号" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="128" autofocus></div>
      <label for="password">密码</label><div class="dw-login-input"><i data-lucide="lock-keyhole" aria-hidden="true"></i><input id="password" name="password" type="password" placeholder="请输入登录密码" autocomplete="current-password" required maxlength="4096"><button type="button" id="toggle-password" aria-label="显示密码" aria-pressed="false"><i data-lucide="eye" aria-hidden="true"></i></button></div>
      <p id="login-error" role="alert" hidden></p>
      <button class="dw-login-submit" type="submit"><span>登录</span><i data-lucide="arrow-right" aria-hidden="true"></i></button>
    </form>
    <div class="dw-login-foot"><i data-lucide="shield-check" aria-hidden="true"></i><span>容器运行监控</span></div>
  </section></main><footer class="dw-login-footer">Docker Monitor</footer>
</div></body></html>
