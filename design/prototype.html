<script>
(() => {
  const root = document.getElementById('dock-preview');
  const initial = [

    {id:'nginx',name:'nginx-proxy',image:'jc21/nginx-proxy-manager:latest',icon:'network',state:'running',cpu:0.8,memory:186,time:'12 天',port:'80 → 80 · 443 → 443',health:'健康',group:'网络服务'},
    {id:'immich',name:'immich-server',image:'ghcr.io/immich-app/immich-server:v2.0',icon:'images',state:'warning',cpu:8.4,memory:1843,time:'3 天',port:'2283 → 2283',health:'健康检查异常',group:'媒体服务'},
    {id:'postgres',name:'postgres',image:'postgres:16-alpine',icon:'database',state:'running',cpu:1.9,memory:721,time:'12 天',port:'未映射主机端口',health:'健康',group:'数据服务'},
    {id:'redis',name:'redis',image:'redis:7-alpine',icon:'layers',state:'running',cpu:0.3,memory:42,time:'12 天',port:'未映射主机端口',health:'健康',group:'数据服务'},
    {id:'uptime',name:'uptime-kuma',image:'louislam/uptime-kuma:1',icon:'activity',state:'running',cpu:0.5,memory:198,time:'8 天',port:'3001 → 3001',health:'健康',group:'运维工具'},
    {id:'backup',name:'scheduled-backup',image:'offen/docker-volume-backup:latest',icon:'archive',state:'stopped',cpu:0,memory:0,time:'已停止 2 小时',port:'未映射主机端口',health:'未运行',group:'备份工具'},
    {id:'monitor',name:'docker-monitor',image:'docker-monitor:1.0.0',icon:'container',state:'running',cpu:0.3,memory:83,time:'12 天',port:'9080 → 8080',health:'健康',group:'运维工具',protected:true,self:true}
  ];
  const icons = (name) => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const safe = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const saved = window.openai?.widgetState?.privateContent;
  const models = new Map();
  const systemAppearance=window.matchMedia('(prefers-color-scheme: dark)');
  const applyTheme=app=>{
    const m=models.get(app),mode=m.theme;
    root.style.colorScheme=mode==='auto'?(systemAppearance.matches?'dark':'light'):mode;
    root.dataset.theme=mode;document.documentElement.style.colorScheme=root.style.colorScheme;

  };
  systemAppearance.addEventListener('change',()=>{for(const [app,m] of models)if(m.theme==='auto')applyTheme(app);});
  const memoryLabel = value => value === 0 ? '—' : value >= 1024 ? (value/1024).toFixed(2)+' GB' : value+' MB';
  const refreshIcons = () => { if (globalThis.lucide) lucide.createIcons({root,attrs:{width:16,height:16}}); };
  const badge = c => `<span class="dw-badge ${c.state==='warning'?'warning':c.state==='stopped'?'stopped':''}">${c.state==='warning'?icons('triangle-alert'):'<span class="dw-dot"></span>'}${c.state==='warning'?'健康异常':c.state==='stopped'?'已停止':'运行中'}</span>`;
  const name = (c,inline=false) => `<div class="dw-name-button"><span class="dw-container-icon ${c.self?'dw-program-icon':''}">${c.self?'<img src="/icons/icon.svg?v=a2" alt="Docker Monitor">':icons(c.icon)}</span><span class="dw-name-text"><strong>${safe(c.name)}</strong><small>${safe(c.image)}</small>${inline?`<span class="dw-inline-update">${updateStatus(c)}${c.protected?'':`<button type="button" class="dw-auto-button ${c.auto?'enabled':''}" data-policy aria-label="设置 ${safe(c.name)} 自动更新">· 自动${c.auto?'开启':'关闭'}</button>`}</span>`:''}</span></div>`;
  const updateStatus = c => c.protected?`<span class="dw-update-status">${icons('shield-check')}${c.self?'本程序 · 已保护':'受保护 · 不参与更新'}</span>`:`<span class="dw-update-status ${c.update==='available'?'available':''}">${icons(c.update==='available'?'circle-arrow-up':c.update==='current'?'check':'clock-3')}${c.update==='available'?'有更新':c.update==='current'?(c.lastResult||'已是最新'):'尚未检查'}</span>`;
  const actions = c => c.protected ? `<span class="dw-protected">${icons('shield-check')}受保护</span>` : `<div class="dw-actions"><button type="button" class="dw-action ${c.update==='available'?'update':''}" data-${c.update==='available'?'action="update"':'check="'+c.id+'"'} data-id="${c.id}">${icons(c.update==='available'?'download':'refresh-cw')}${c.update==='available'?'更新':'检查'}</button>${c.state==='stopped'?`<button type="button" class="dw-action start" data-action="start" data-id="${c.id}">${icons('play')}启动</button>`:`<button type="button" class="dw-action" data-action="restart" data-id="${c.id}">${icons('rotate-cw')}重启</button><button type="button" class="dw-action stop" data-action="stop" data-id="${c.id}">${icons('square')}停止</button>`}</div>`;
  const restore = app => {
    const layout = app.dataset.layout;

    const containers = initial.map(c=>({...c,update:['nginx','uptime'].includes(c.id)?'available':'unchecked',auto:false,lastResult:null,discoveredAt:Date.now()-48*3600000}));
    for(const c of containers){if(['unchecked','available','current'].includes(state.updates?.[c.id]))c.update=state.updates[c.id];if(!c.protected&&typeof state.auto?.[c.id]==='boolean')c.auto=state.auto[c.id];if(state.results?.[c.id]==='更新成功')c.lastResult='更新成功';if(typeof state.times?.[c.id]==='string')c.time=state.times[c.id];}
    for(const c of containers){if(!c.protected && ['running','stopped','warning'].includes(state.states?.[c.id])) c.state=state.states[c.id];}
    return {containers,theme:['light','dark','auto'].includes(state.theme)?state.theme:'auto',filter:['all','running','warning','stopped'].includes(state.filter)?state.filter:'all',search:state.search||'',pending:null,timer:null,lastCheck:state.lastCheck||'尚未检查',checkCron:state.checkCron||'0 */6 * * *',updateMode:state.updateMode==='delay'?'delay':'scheduled',updateCron:state.updateCron||'0 3 * * *',waitValue:Number.isFinite(state.waitValue)?state.waitValue:(state.waitHours||24),waitUnit:state.waitUnit==='minutes'?'minutes':'hours',design:{radius:18,compact:false}};

  };
  const shell = app => {

      if(target.hasAttribute('data-auto-run')){
        if(!savePolicy(app))return;let count=0;
        for(const c of m.containers){if(c.auto&&!c.protected&&c.state==='running'&&c.update==='available'&&(m.updateMode==='scheduled'||Date.now()-c.discoveredAt>=m.waitValue*(m.waitUnit==='minutes'?60000:3600000))){c.update='current';c.lastResult='更新成功';c.time='刚刚';count++;}}
        close(app);render(app);persist();toast(app,count?'已模拟自动更新 '+count+' 个容器':'没有符合策略的可更新容器');
      }
      if(target.hasAttribute('data-filter')){m.filter=target.dataset.filter;render(app);animateList(app);persist();}
      if(target.hasAttribute('data-view')){app.dataset.layout=target.dataset.view;render(app);animateList(app);persist();}
      if(target.hasAttribute('data-close'))close(app);
      if(target.hasAttribute('data-action')){const c=m.containers.find(c=>c.id===target.dataset.id);if(c&&!c.protected)dialog(app,c,target.dataset.action);}
      if(target.hasAttribute('data-confirm')&&m.pending){
        const c=m.containers.find(c=>c.id===m.pending.id),action=m.pending.action;
        if(!c||c.protected)return;
        if(action==='update'){c.update='current';c.lastResult='更新成功';if(c.state!=='stopped')c.time='刚刚';}
        else if(action==='stop'){c.state='stopped';c.time='刚刚停止';}
        else{c.state=c.id==='immich'?'warning':'running';c.time='刚刚';}
        close(app);render(app);persist();
        const messages={start:'已模拟启动',stop:'已模拟停止',restart:'已模拟重启',update:'已模拟更新成功'};
        toast(app,`${c.name} ${messages[action]}`);
        app.querySelector('[data-update]').textContent='模拟状态已更新';
      }
    });
    app.querySelector('.dw-overlay').addEventListener('click',e=>{if(e.target.classList.contains('dw-overlay'))close(app);});
    app.addEventListener('keydown',e=>{
      const overlay=app.querySelector('.dw-overlay');if(overlay.hidden)return;
      if(e.key==='Escape')close(app);
      if(e.key==='Tab'){const controls=[...overlay.querySelectorAll('button,input:not(:disabled),select')],first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
    });
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{app.style.setProperty('--dw-radius',m.design.radius+'px');app.style.setProperty('--dw-row-pad',m.design.compact?'10px':'14px');}});tweak.addSlider(m.design,'radius',{label:'窗口圆角',min:4,max:24,unit:'px'});tweak.addToggle(m.design,'compact',{label:'紧凑列表'});}
  }
  window.addEventListener('openai:set_globals',e=>{
    const incoming=e.detail?.globals?.widgetState?.privateContent;if(!incoming)return;
    for(const [app,m] of models){
      const state=incoming.monitor||incoming[app.dataset.layout];if(!state)continue;
      if(['list','cards'].includes(state.view))app.dataset.layout=state.view;
      if(['light','dark','auto'].includes(state.theme))m.theme=state.theme;
      if(['all','running','warning','stopped'].includes(state.filter))m.filter=state.filter;
      if(typeof state.search==='string')m.search=state.search;
      for(const c of m.containers){if(!c.protected&&['running','warning','stopped'].includes(state.states?.[c.id]))c.state=state.states[c.id];if(['unchecked','available','current'].includes(state.updates?.[c.id]))c.update=state.updates[c.id];if(!c.protected&&typeof state.auto?.[c.id]==='boolean')c.auto=state.auto[c.id];if(state.results?.[c.id]==='更新成功')c.lastResult='更新成功';if(typeof state.times?.[c.id]==='string')c.time=state.times[c.id];}
      if(typeof state.lastCheck==='string')m.lastCheck=state.lastCheck;
      if(typeof state.checkCron==='string')m.checkCron=state.checkCron;
      if(typeof state.updateCron==='string')m.updateCron=state.updateCron;
      if(['scheduled','delay'].includes(state.updateMode))m.updateMode=state.updateMode;
      if(Number.isInteger(state.waitValue))m.waitValue=state.waitValue;if(['minutes','hours'].includes(state.waitUnit))m.waitUnit=state.waitUnit;
      applyTheme(app);app.querySelector('input').value=m.search;render(app);
    }
  });
  window.addEventListener('docker-monitor:cron-ready',()=>{for(const app of models.keys()){const box=app.querySelector('.dw-dialog');if(!app.querySelector('.dw-overlay').hidden&&box.classList.contains('policy'))validateCron(box);}});
})();
</script>
